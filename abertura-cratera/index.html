<!DOCTYPE html>

<style>
:root{--ouro:#C7A779;--creme:#E7DBD2}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--creme);font-family:'Inter',system-ui,sans-serif;overflow:hidden}
canvas#stage{display:block;width:100vw;height:100vh;height:100dvh}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(ellipse at center,#0d1114 0%,#000 70%);z-index:5;transition:opacity .8s;padding:16px;text-align:center}
#intro.hide{opacity:0;pointer-events:none}
#intro .eyebrow{font-size:.72rem;letter-spacing:.42em;text-transform:uppercase;color:#8b8f94}
#intro h1{margin:0;font-family:'Cinzel',Georgia,serif;font-weight:600;font-size:clamp(1.6rem,5vw,2.8rem);letter-spacing:.2em;color:var(--ouro)}

button.primary:hover{background:#d8bb90}

#hud.show{opacity:1}

#rec{position:fixed;left:16px;top:16px;z-index:4;font-size:.7rem;letter-spacing:.25em;color:#ff4a3d;display:none}
#rec.on{display:block;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
</style>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* =========================================================================
   ROTEIRO (segundos)
   0.0  – 5.0   calma: treino, conversa, música ambiente da academia
   5.0          tremor: a música morre, luzes piscam, todos param
   6.2          rachaduras correm pelo piso
   7.0          o centro desaba — pânico geral, alarme, a cratera cresce
   13.2         a borda alcança a câmera — queda
   14.4         corte seco para o preto
   15.2         título
   ========================================================================= */
const T_TREMOR = 5.0, T_CRACK = 6.2, T_COLLAPSE = 7.0, T_FALL = 13.2, T_BLACK = 14.4, T_TITLE = 15.2, T_END = 19.5;

const Q = new URLSearchParams(location.search);
const CAPTURE = Q.has('capture');
const TXT = {
  local: Q.get('local') || 'LION PRO ARENA',
  hora: Q.get('hora') || '18:47 · TERÇA-FEIRA',
  titulo: Q.get('titulo') || 'FOUNDER LEGACY',
  sub: Q.get('subtitulo') || 'MÉTODO DOS 6 PILARES',
};

/* ---------------- utilidades ---------------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
let rand = mulberry32(1337);          // simulação (re-semeado no reset)
const brand = mulberry32(42);         // construção do cenário
const rr = (a,b,r=brand)=>a+(b-a)*r();
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const lerp=(a,b,t)=>a+(b-a)*t;
const hash1=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s);};
const V3=THREE.Vector3;
const UP=new V3(0,1,0);

/* ---------------- a cratera ---------------- */
const C = new THREE.Vector2(0.4,-11);
function craterR(t){ if(t<T_COLLAPSE) return -1; const u=t-T_COLLAPSE; return 3.2*(1-Math.exp(-u*3))+1.0*u+0.36*u*u; }
function rimNoise(a){ return 1+0.12*Math.sin(a*3+1.3)+0.07*Math.sin(a*7+0.4)+0.04*Math.sin(a*13+2.1); }
function effDist(x,z){ const dx=x-C.x,dz=z-C.y; return Math.hypot(dx,dz)/rimNoise(Math.atan2(dz,dx)); }
function swallowed(x,z,t){ const R=craterR(t); return R>0 && effDist(x,z)<R; }
function shakeAt(t){
  let s=0;
  if(t>T_TREMOR) s=0.22*sstep(T_TREMOR,T_TREMOR+0.7,t);
  if(t>T_CRACK) s+=0.35*Math.exp(-(t-T_CRACK)*3)+0.1;
  if(t>T_COLLAPSE) s=Math.max(s,0.5+0.7*Math.exp(-(t-T_COLLAPSE)*1.1));
  if(t>T_FALL) s=0.85;
  if(t>T_BLACK) s=0;
  return s;
}

/* ---------------- renderer ---------------- */
const canvas=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance',preserveDrawingBuffer:CAPTURE});
renderer.setPixelRatio(CAPTURE?1:Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x020304);
scene.fog=new THREE.FogExp2(0x040608,0.017);
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;

const camera=new THREE.PerspectiveCamera(50,1,0.05,200);

/* ---------------- texturas procedurais ---------------- */
function canvasTex(w,h,draw,{srgb=true,repeat=null}={}){
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);
  const t=new THREE.CanvasTexture(c);if(srgb)t.colorSpace=THREE.SRGBColorSpace;
  if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(...repeat);}
  t.anisotropy=8;t.userData.canvas=c;t.userData.ctx=g;return t;
}
const concreteTex=canvasTex(512,512,(g,w,h)=>{
  g.fillStyle='#8a8c8f';g.fillRect(0,0,w,h);
  const r=mulberry32(9);
  for(let i=0;i<9000;i++){const v=110+r()*60|0;g.fillStyle=`rgba(${v},${v},${v+4},${r()*.18})`;g.fillRect(r()*w,r()*h,1+r()*3,1+r()*3);}
  for(let i=0;i<40;i++){const v=90+r()*80|0;const gr=g.createRadialGradient(r()*w,r()*h,0,r()*w,r()*h,30+r()*120);gr.addColorStop(0,`rgba(${v},${v},${v},.12)`);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,w,h);}
});
const slatTex=canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#1d232b';g.fillRect(0,0,w,h);
  for(let x=0;x<w;x+=16){g.fillStyle='#10141a';g.fillRect(x,0,2,h);g.fillStyle='#262d36';g.fillRect(x+2,0,1,h);}
});
const lionTex=canvasTex(256,256,(g,w,h)=>{
  g.clearRect(0,0,w,h);g.translate(w/2,h/2);g.fillStyle='#e9e9e9';
  for(let i=0;i<16;i++){g.save();g.rotate(i/16*Math.PI*2);g.beginPath();g.moveTo(-14,-58);g.lineTo(0,-104+(i%2)*14);g.lineTo(14,-58);g.closePath();g.fill();g.restore();}
  g.beginPath();g.arc(0,0,66,0,Math.PI*2);g.fill();
  g.fillStyle='#0e0f11';g.beginPath();g.ellipse(0,6,44,54,0,0,Math.PI*2);g.fill();
  g.fillStyle='#e9e9e9';g.beginPath();g.moveTo(-26,-8);g.lineTo(-8,-2);g.lineTo(-24,4);g.fill();g.beginPath();g.moveTo(26,-8);g.lineTo(8,-2);g.lineTo(24,4);g.fill();
  g.beginPath();g.moveTo(-12,18);g.lineTo(12,18);g.lineTo(0,34);g.fill();g.fillRect(-2,34,4,14);
});
const brandTex=canvasTex(512,96,(g,w,h)=>{
  g.fillStyle='#0d0e10';g.fillRect(0,0,w,h);g.fillStyle='#dcdcdc';g.font='italic 700 54px Arial, sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('LION PRO',w/2,h/2+2);
});
const exitTex=canvasTex(256,96,(g,w,h)=>{
  g.fillStyle='#2a0303';g.fillRect(0,0,w,h);g.fillStyle='#ff2a1c';g.font='700 56px Arial, sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('SAÍDA',w/2,h/2+3);
});

/* ---------------- materiais ---------------- */
function std(color,rough,metal,env=0.25,extra={}){return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal,envMapIntensity:env,...extra});}
const M={
  frame:std(0x0d0e10,.42,.55,.5),
  matte:std(0x131417,.75,.15,.3),
  pad:std(0x18181a,.62,0,.25),
  chrome:std(0xcfd5db,.16,1,1.1),
  plate:std(0x0a0a0b,.48,.3,.4),
  wall:std(0x8d9094,.92,0,.2,{map:concreteTex}),
  wallDark:std(0x14171c,.85,0,.15),
  ceiling:std(0x2a323c,.7,.1,.2,{map:slatTex}),
  floor:std(0x7d8084,.3,0,.55,{map:concreteTex}),
  rubber:std(0x0c0c0d,.95,0,.1),
  lionPlate:new THREE.MeshStandardMaterial({map:lionTex,transparent:true,roughness:.4,metalness:.2,emissive:0x333333,emissiveMap:lionTex,emissiveIntensity:.6}),
  brand:new THREE.MeshStandardMaterial({map:brandTex,roughness:.4,emissive:0xffffff,emissiveMap:brandTex,emissiveIntensity:.25}),
  exit:new THREE.MeshStandardMaterial({map:exitTex,emissive:0xffffff,emissiveMap:exitTex,emissiveIntensity:3}),
  doorGlow:new THREE.MeshStandardMaterial({color:0x000000,emissive:0xffb46a,emissiveIntensity:1.6}),
  earth:new THREE.MeshStandardMaterial({vertexColors:true,roughness:1,metalness:0,side:THREE.BackSide,envMapIntensity:0.05}),
  black:new THREE.MeshBasicMaterial({color:0x000000}),
};
function mesh(geo,mat,{cast=true,recv=true}={}){const m=new THREE.Mesh(geo,mat);m.castShadow=cast;m.receiveShadow=recv;return m;}
const G={
  box:(w,h,d)=>new THREE.BoxGeometry(w,h,d),
  rbox:(w,h,d,r=.04)=>new RoundedBoxGeometry(w,h,d,3,r),
  cyl:(rt,rb,h,s=20)=>new THREE.CylinderGeometry(rt,rb,h,s),
  cap:(r,l)=>new THREE.CapsuleGeometry(r,l,6,14),
  sph:(r)=>new THREE.SphereGeometry(r,20,14),
};

/* ---------------- luzes ---------------- */
const hemi=new THREE.HemisphereLight(0x8fa3b8,0x1a1a1a,0.45);scene.add(hemi);
const key=new THREE.SpotLight(0xfff0dc,260,0,1.15,0.9,1.6);
key.position.set(0.5,4.9,-2);key.target.position.set(0.5,0,-7);key.castShadow=true;
key.shadow.mapSize.set(CAPTURE?1024:2048,CAPTURE?1024:2048);key.shadow.bias=-0.0004;key.shadow.radius=4;key.shadow.camera.near=0.5;key.shadow.camera.far=40;
scene.add(key,key.target);
const roomLights=[];
for(const [x,z] of [[-6,-2],[6,-2],[-6,-13],[6,-13],[-6,-24],[6,-24],[0,4],[0,-19]]){
  const l=new THREE.PointLight(0xfff1de,22,0,1.7);l.position.set(x,4.6,z);scene.add(l);roomLights.push({l,base:22,leds:[]});
}
const alarms=[];
for(const [x,z] of [[9,-29.4],[-11.5,2],[11.5,-12]]){
  const l=new THREE.PointLight(0xff1a0a,0,0,1.5);l.position.set(x,4.3,z);scene.add(l);alarms.push(l);
}

/* ---------------- corpos dinâmicos (física simples) ---------------- */
const bodies=[];
function addBody(obj,o={}){
  const b={obj,kind:o.kind||'prop',r:o.r??0.6,half:o.half??0.05,drop:o.drop??Infinity,swing:o.swing||0,
    p0:obj.position.clone(),q0:obj.quaternion.clone(),drop0:o.drop??Infinity,
    vel:new V3(),av:new V3(),state:0,fellAt:0,id:bodies.length,onFall:o.onFall||null,dust:o.dust??1};
  scene.add(obj);bodies.push(b);return b;
}
function resetBodies(){for(const b of bodies){b.obj.position.copy(b.p0);b.obj.quaternion.copy(b.q0);b.vel.set(0,0,0);b.av.set(0,0,0);b.state=0;b.drop=b.drop0;b.obj.visible=true;}}

/* ---------------- piso (placas instanciadas) ---------------- */
const TILE=1, FX0=-13, FX1=13, FZ0=-30, FZ1=14;
const tilesX=(FX1-FX0)/TILE, tilesZ=(FZ1-FZ0)/TILE, NT=tilesX*tilesZ;
const tileGeo=new THREE.BoxGeometry(TILE*0.992,0.28,TILE*0.992);
{ // UV de cada placa = recorte do mapa de concreto
  const uv=tileGeo.attributes.uv; for(let i=0;i<uv.count;i++){uv.setXY(i,uv.getX(i)*0.25,uv.getY(i)*0.25);}
}
const floorMesh=new THREE.InstancedMesh(tileGeo,M.floor,NT);floorMesh.receiveShadow=true;floorMesh.castShadow=true;
floorMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(floorMesh);
const tiles=[];
{
  let i=0;const col=new THREE.Color();
  for(let ix=0;ix<tilesX;ix++)for(let iz=0;iz<tilesZ;iz++){
    const x=FX0+(ix+.5)*TILE, z=FZ0+(iz+.5)*TILE;
    const e=effDist(x,z); const dir=new V3(C.x-x,0,C.y-z).normalize();
    tiles.push({i,x,z,e,dir,p:new V3(x,-0.14,z),q:new THREE.Quaternion(),vel:new V3(),av:new V3(),state:0,delay:brand()*0.35,jit:brand()});
    const v=0.86+brand()*0.18;col.setRGB(v,v,v*1.01);floorMesh.setColorAt(i,col);i++;
  }
}
const _m4=new THREE.Matrix4(),_s1=new V3(1,1,1),_s0=new V3(0,0,0),_q=new THREE.Quaternion(),_v=new V3(),_v2=new V3(),_e=new THREE.Euler();
function writeTile(t){_m4.compose(t.p,t.q,t.state===3?_s0:_s1);floorMesh.setMatrixAt(t.i,_m4);}
function resetTiles(){for(const t of tiles){t.p.set(t.x,-0.14,t.z);t.q.identity();t.vel.set(0,0,0);t.av.set(0,0,0);t.state=0;writeTile(t);}floorMesh.instanceMatrix.needsUpdate=true;}

/* ---------------- rachaduras (shader revela do centro para fora) ---------------- */
const crackMat=new THREE.ShaderMaterial({
  uniforms:{uFront:{value:0},uR:{value:-1}},transparent:true,depthWrite:false,
  vertexShader:`attribute float aD;varying float vD;void main(){vD=aD;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform float uFront,uR;varying float vD;void main(){if(vD>uFront||vD<uR+.5)discard;gl_FragColor=vec4(0.012,0.012,0.014,0.92);}`,
});
{
  const pos=[],dd=[],r=mulberry32(77);
  const seg=(x1,z1,x2,z2,w)=>{const dx=x2-x1,dz=z2-z1,l=Math.hypot(dx,dz)||1,nx=-dz/l*w,nz=dx/l*w;
    const pts=[[x1-nx,z1-nz],[x1+nx,z1+nz],[x2+nx,z2+nz],[x1-nx,z1-nz],[x2+nx,z2+nz],[x2-nx,z2-nz]];
    for(const [px,pz] of pts){pos.push(px,0.012,pz);dd.push(effDist(px,pz));}};
  const crack=(x,z,ang,len,w,depth)=>{let cx=x,cz=z,a=ang;const n=Math.ceil(len/0.35);
    for(let k=0;k<n;k++){a+=(r()-.5)*0.9;const nx=cx+Math.cos(a)*0.35,nz=cz+Math.sin(a)*0.35;seg(cx,cz,nx,nz,w*(1-k/n*0.7));
      if(depth<2&&r()<0.12)crack(nx,nz,a+(r()<.5?-1:1)*(0.5+r()*0.6),len*0.35*r()+1,w*0.6,depth+1);cx=nx;cz=nz;}};
  for(let k=0;k<16;k++){const a=k/16*Math.PI*2+r()*0.3;crack(C.x+Math.cos(a)*0.3,C.y+Math.sin(a)*0.3,a,8+r()*14,0.035,0);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('aD',new THREE.Float32BufferAttribute(dd,1));
  const cm=new THREE.Mesh(g,crackMat);cm.renderOrder=2;cm.frustumCulled=false;scene.add(cm);
}

/* ---------------- paredes do abismo (cilindro escalado por R) ---------------- */
const shaft=new THREE.Group();scene.add(shaft);shaft.position.set(C.x,0,C.y);
{
  const seg=120, rows=40, H=70;const pos=[],col=[],idx=[];const r=mulberry32(5);
  const nz=(a,y)=>0.07*Math.sin(a*11+y*0.9)+0.05*Math.sin(a*23-y*1.7)+0.04*Math.sin(a*41+y*3.1)+0.025*Math.sin(a*97-y*5.3);
  for(let j=0;j<=rows;j++){const y=-0.12-Math.pow(j/rows,1.6)*H;
    for(let i=0;i<=seg;i++){const a=i/seg*Math.PI*2;const k=rimNoise(a)*(1+nz(a,y)+ (j<2?0:0.02*(r()-.5)));
      pos.push(Math.cos(a)*k,y,Math.sin(a)*k);
      const d=Math.exp(y*0.11);const strata=0.5+0.5*Math.sin(y*3.1+Math.sin(a*5)*0.8);
      const band=j<1?0.3:(0.07+0.1*strata*strata+0.05*r());
      const c=band*d;const warm=0.9+0.2*Math.sin(y*1.3);col.push(c*1.1*warm,c*0.96,c*0.84/warm);}}
  for(let j=0;j<rows;j++)for(let i=0;i<seg;i++){const a=j*(seg+1)+i,b=a+seg+1;idx.push(a,b,a+1,b,b+1,a+1);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));g.setIndex(idx);g.computeVertexNormals();
  const walls=mesh(g,M.earth,{cast:false,recv:true});shaft.add(walls);
  const floorDisc=mesh(new THREE.CircleGeometry(1.3,48),M.black,{cast:false,recv:false});floorDisc.rotation.x=-Math.PI/2;floorDisc.position.y=-H+1;shaft.add(floorDisc);
}

/* ---------------- arquitetura ---------------- */
const CEIL=5.2;
// painéis do teto (caem durante o colapso)
for(let x=FX0+1;x<FX1;x+=2)for(let z=FZ0+1;z<FZ1;z+=2){
  const p=mesh(G.box(1.98,0.1,1.98),M.ceiling,{cast:false,recv:true});p.position.set(x,CEIL+0.05,z);
  addBody(p,{kind:'ceil',r:1,half:0.06,drop:brand()<0.16?rr(7.4,12.8):Infinity,dust:0.6});
}
// paredes em segmentos
function wallSeg(x,z,w,h,d,mat,rotY=0){const m=mesh(G.box(w,h,d),mat);m.position.set(x,h/2,z);m.rotation.y=rotY;addBody(m,{kind:'wall',r:w/2,half:h/2,dust:2});return m;}
for(let x=FX0+1;x<FX1;x+=2) wallSeg(x,FZ0-0.15,2,CEIL,0.3,M.wall);
for(let z=FZ0+1;z<FZ1;z+=2){ wallSeg(FX0-0.15,z,0.3,CEIL,2,M.wallDark); wallSeg(FX1+0.15,z,0.3,CEIL,2,z<-12?M.wallDark:M.wall); }

const leds=[];
function chevron(x,z,ang,size){
  const g=new THREE.Group();const mat=new THREE.MeshStandardMaterial({color:0x111111,emissive:0xfff3e2,emissiveIntensity:5,roughness:.5});
  const L=size;for(const s of [-1,1]){const bar=new THREE.Mesh(G.box(0.07,0.05,L),mat);const a=s*0.62;
    bar.position.set(Math.sin(a)*L/2,0,Math.cos(a)*L/2);bar.rotation.y=a;g.add(bar);}
  g.position.set(x,CEIL-0.04,z);g.rotation.y=ang;
  const led={g,mat,id:leds.length,death:rr(7.3,12.6),flick:brand(),sparked:false,level:1};
  led.body=addBody(g,{kind:'ceil',r:size*0.5,half:0.04,drop:brand()<0.4?led.death+rr(0.1,0.6):Infinity,swing:0.06,dust:0.3});
  leds.push(led);return led;
}
for(let z=-27;z<=10;z+=4.6){for(const x of [-9,0,9]){chevron(x+rr(-1.2,1.2),z+rr(-1,1),rr(0,Math.PI*2),rr(2.2,3.4));}}
for(const rl of roomLights){ // liga cada luz pontual às fitas mais próximas
  const d=leds.map(l=>({l,d:Math.hypot(l.g.position.x-rl.l.position.x,l.g.position.z-rl.l.position.z)})).sort((a,b)=>a.d-b.d);
  rl.leds=d.slice(0,3).map(o=>o.l);
}

function seg7(g,x,y,s,ch,on){ // dígito de 7 segmentos
  const map={'0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc','5':'afgcd','6':'afgedc','7':'abc','8':'abcdefg','9':'abcdfg','-':'g','E':'afged','r':'eg',' ':''};
  const segs=map[ch]??'';const w=s*0.55,h=s,th=s*0.11;
  const R={a:[x+th,y,w-2*th,th],d:[x+th,y+h-th,w-2*th,th],g:[x+th,y+h/2-th/2,w-2*th,th],f:[x,y+th,th,h/2-th*1.2],b:[x+w-th,y+th,th,h/2-th*1.2],e:[x,y+h/2+th*.2,th,h/2-th*1.2],c:[x+w-th,y+h/2+th*.2,th,h/2-th*1.2]};
  for(const k in R){g.fillStyle=segs.includes(k)?on:'rgba(255,40,30,.07)';g.fillRect(...R[k]);}
}
function drawConsole(t){
  const g=consoleTex.userData.ctx,w=1024,h=512;
  g.fillStyle='#0b0c0e';g.fillRect(0,0,w,h);
  g.strokeStyle='rgba(220,220,220,.22)';g.lineWidth=2;   // grafismo de linha (atleta), como no console da foto
  g.beginPath();g.moveTo(70,470);g.bezierCurveTo(30,330,140,250,110,150);g.bezierCurveTo(90,90,170,60,200,110);g.bezierCurveTo(230,170,190,230,250,300);g.stroke();
  g.beginPath();g.moveTo(150,470);g.bezierCurveTo(120,380,210,330,200,260);g.stroke();
  g.fillStyle='#d9d9d9';g.font='italic 800 44px Arial';g.textAlign='center';g.fillText('LION',w/2,62);
  g.fillStyle='#8a8a8a';g.font='700 70px Arial';g.fillText('X4',w-170,470);
  const dead=t>T_COLLAPSE+2.6, panic=t>T_TREMOR;
  const flick=panic&&hash1(Math.floor(t*18))<(t>T_COLLAPSE?0.45:0.2);
  const on=dead||flick?'rgba(255,40,30,.06)':'#ff2a1c';
  g.fillStyle='#050505';g.fillRect(270,150,330,150);g.fillRect(640,150,280,150);g.fillRect(270,340,170,80);

  let a=String(kcal), b='1:07';
  if(t>T_TREMOR){a=hash1(Math.floor(t*12))<0.5?a:String(1000+Math.floor(hash1(Math.floor(t*12)+.3)*8999));b='--:--';}
  if(t>T_COLLAPSE){a=' Err';b='0:00';}
  for(let i=0;i<4;i++) seg7(g,292+i*76,170,110,a[i]||' ',on);
  const bs=b.replace(':','');for(let i=0;i<bs.length&&i<3;i++) seg7(g,668+i*80,170,110,bs[i],on);
  if(!dead&&!flick){g.fillStyle=on;g.fillRect(744,195,10,10);g.fillRect(744,240,10,10);}
  for(let i=0;i<3;i++){g.fillStyle=(t%1.2)<0.6||dead?'rgba(255,40,30,.12)':on;g.beginPath();g.arc(310+i*45,382,10,0,Math.PI*2);g.fill();}

  consoleTex.needsUpdate=true;
}

function stepBodies(dt,t){

function stepTiles(dt,t){

          const ax=_v.crossVectors(UP,tl.dir).normalize();tl.av.copy(ax).multiplyScalar(1+rand()*3);tl.av.x+=(rand()-.5)*2;tl.av.z+=(rand()-.5)*2;
          if(rand()<0.55)smoke.spawn(tl.x,0.1,tl.z,rr(-.5,.5,rand)-tl.dir.x*0.6,rr(0.6,2.2,rand),rr(-.5,.5,rand)-tl.dir.z*0.6,rr(3,6,rand),1.4,5,0.32);
          if(rand()<0.6)spawnDebris(tl.x+rr(-.5,.5,rand),0,tl.z+rr(-.5,.5,rand),rr(-1,1,rand),rr(0,2.5,rand),rr(-1,1,rand),rr(0.04,0.16,rand));

function ledLevel(l,t){

}
function step(dt){

/* ---------------- câmera ---------------- */
const CAMK=[
  [0.0,[0.35,1.66,7.75],[0.1,1.42,-20]],
  [4.8,[0.33,1.63,7.3],[0.25,1.36,-20]],
  [6.6,[0.3,1.6,7.25],[0.45,0.5,-12]],
  [8.5,[1.0,2.05,8.5],[0.4,-1.2,-10]],
  [11.0,[1.65,2.35,9.1],[0.4,-2.6,-7]],
  [13.2,[1.55,2.15,9.3],[0.4,-3.4,-4]],
  [15.0,[1.55,2.15,9.3],[0.4,-3.4,-4]],

function cr(p0,p1,p2,p3,u,out){const u2=u*u,u3=u2*u;return out.set(
  0.5*(2*p1.x+(-p0.x+p2.x)*u+(2*p0.x-5*p1.x+4*p2.x-p3.x)*u2+(-p0.x+3*p1.x-3*p2.x+p3.x)*u3),
  0.5*(2*p1.y+(-p0.y+p2.y)*u+(2*p0.y-5*p1.y+4*p2.y-p3.y)*u2+(-p0.y+3*p1.y-3*p2.y+p3.y)*u3),
  0.5*(2*p1.z+(-p0.z+p2.z)*u+(2*p0.z-5*p1.z+4*p2.z-p3.z)*u2+(-p0.z+3*p1.z-3*p2.z+p3.z)*u3));}
const _cp=new V3(),_cl=new V3();
function updateCamera(t){
  let i=0;while(i<CAMK.length-2&&t>CAMK[i+1].t)i++;
  const k0=CAMK[Math.max(0,i-1)],k1=CAMK[i],k2=CAMK[i+1],k3=CAMK[Math.min(CAMK.length-1,i+2)];
  const u=sstep(0,1,clamp((t-k1.t)/(k2.t-k1.t),0,1))*0.6+clamp((t-k1.t)/(k2.t-k1.t),0,1)*0.4;
  cr(k0.p,k1.p,k2.p,k3.p,u,_cp);cr(k0.l,k1.l,k2.l,k3.l,u,_cl);
  // passada na esteira (para quando o tremor começa)
  const walk=1-sstep(T_TREMOR,T_TREMOR+0.6,t);
  _cp.y+=Math.sin(t*Math.PI*2*0.92)*0.022*walk;_cp.x+=Math.sin(t*Math.PI*0.92)*0.012*walk;
  // câmera na mão

  // queda final para dentro da cratera

  const s=shakeAt(t);
  const n1=Math.sin(t*23.1)*0.5+Math.sin(t*37.7)*0.3+Math.sin(t*61.3)*0.2, n2=Math.sin(t*19.7+1)*0.5+Math.sin(t*43.1+2)*0.3+Math.sin(t*71.9)*0.2, n3=Math.sin(t*29.3+4)*0.6+Math.sin(t*53.3)*0.4;
  _cp.x+=n1*s*0.05;_cp.y+=n2*s*0.04;_cp.z+=n3*s*0.03;
  camera.position.copy(_cp);camera.lookAt(_cl);
  camera.rotateZ(roll+n3*s*0.018+Math.sin(t*0.4)*0.004);camera.rotateX(n1*s*0.012);
}

/* ---------------- atualização visual (por quadro) ---------------- */
let lastTV=-1,lastConsole=-1;
function updateVisuals(t){
  const R=craterR(t);
  shaft.visible=R>0;if(R>0)shaft.scale.set(R,1,R);
  crackMat.uniforms.uFront.value=t<T_CRACK?0:(t<T_COLLAPSE?sstep(T_CRACK,T_COLLAPSE+0.3,t)*9:9+(R+0.5)*1.25);
  crackMat.uniforms.uR.value=R;
  // luzes
  let alive=0;for(const l of leds){l.level=ledLevel(l,t);l.mat.emissiveIntensity=5*l.level+0.02;alive+=l.level;}
  alive/=leds.length;
  for(const rl of roomLights){let s=0;for(const l of rl.leds)s+=l.level;rl.l.intensity=rl.base*(s/rl.leds.length);}
  key.intensity=260*(t<T_COLLAPSE?ledLevel(leds[0],t)*0.3+0.7:Math.max(0.12,1-sstep(T_COLLAPSE,T_COLLAPSE+5,t)*0.85)*(hash1(Math.floor(t*9))<0.15?0.3:1));
  hemi.intensity=0.45*(0.35+0.65*alive);
  const alarmOn=t>T_COLLAPSE+0.6&&t<T_BLACK;const pulse=alarmOn?Math.pow(0.5+0.5*Math.sin((t-T_COLLAPSE)*Math.PI*2*1.1),2):0;
  for(const a of alarms)a.intensity=pulse*55;
  const light=0.25+0.75*alive;smoke.mat.uniforms.uLight.value=light*0.62;ceilDust.mat.uniforms.uLight.value=light;
  smoke.mat.uniforms.uTint.value.setRGB(0.09*pulse,0.005*pulse,0);ceilDust.mat.uniforms.uTint.value.setRGB(0.06*pulse,0,0);
  motes.mat.uniforms.uLight.value=1-sstep(T_TREMOR,T_COLLAPSE,t)*0.5;
  if(Math.floor(t*24)!==lastTV){lastTV=Math.floor(t*24);if(tvBody.state===0||t<tvBody.fellAt+0.3)drawTV(t);else{const g=tvTex.userData.ctx;g.fillStyle='#000';g.fillRect(0,0,512,288);tvTex.needsUpdate=true;}}
  if(Math.floor(t*15)!==lastConsole){lastConsole=Math.floor(t*15);drawConsole(t);}
  updateCamera(t);
  // pós
  const U=cinema.uniforms;U.uTime.value=t;
  U.uAb.value=0.5+shakeAt(t)*2.2;U.uGrain.value=0.055+(t>T_COLLAPSE?0.03:0);
  let flash=0;if(t>T_COLLAPSE&&t<T_COLLAPSE+0.5)flash=0.35*(1-(t-T_COLLAPSE)/0.5);if(t>T_CRACK&&t<T_CRACK+0.12)flash=0.12;
  U.uFlash.value=flash;U.uRed.value=pulse*0.12;
  U.uFade.value=t<0.9?1-sstep(0,0.9,t):(t>=T_BLACK?1:0);
  bloom.strength=0.5+(t>T_COLLAPSE?0.1:0);
}

/* ---------------- resize ---------------- */
function resize(w=innerWidth,h=innerHeight){
  renderer.setSize(w,h,!CAPTURE);composer.setSize(w,h);
  const asp=w/h;camera.aspect=asp;
  // retrato: lente grande-angular de celular; paisagem: 2.39:1 com tarjas
  if(asp<1){const hf=58*Math.PI/180;camera.fov=2*Math.atan(Math.tan(hf/2)/asp)*180/Math.PI;cinema.uniforms.uLetter.value=0;}
  else{camera.fov=44;const target=2.39;cinema.uniforms.uLetter.value=asp<target?(1-asp/target)/2:0;}
  camera.updateProjectionMatrix();
  const Hpx=renderer.domElement.height;const sc=Hpx/(2*Math.tan(camera.fov*Math.PI/360));
  for(const p of [smoke,ceilDust,sparks,motes])p.mat.uniforms.uScale.value=sc;
  cinema.uniforms.uRes.value.set(renderer.domElement.width,renderer.domElement.height);
  bloom.resolution.set(renderer.domElement.width/2,renderer.domElement.height/2);
}

   ========================================================================= */
function scheduleAudio(ctx,out,t0){
  const r=mulberry32(99);const SR=ctx.sampleRate;
  const mk=(sec,kind)=>{const b=ctx.createBuffer(2,Math.floor(SR*sec),SR);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let last=0,b0=0,b1=0,b2=0;
    for(let i=0;i<d.length;i++){const w=r()*2-1;if(kind==='brown'){last=(last+0.02*w)/1.02;d[i]=last*3.5;}else if(kind==='pink'){b0=0.99765*b0+w*0.099;b1=0.963*b1+w*0.2965;b2=0.57*b2+w*1.0527;d[i]=(b0+b1+b2+w*0.1848)*0.2;}else d[i]=w;}}return b;};
  const white=mk(2,'white'),brown=mk(4,'brown'),pink=mk(3,'pink');
  const at=s=>t0+s;
  const master=ctx.createGain();master.gain.value=0.9;const comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;master.connect(comp);comp.connect(out);
  // reverb
  const ir=ctx.createBuffer(2,SR*3,SR);for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<d.length;i++)d[i]=(r()*2-1)*Math.pow(1-i/d.length,3.2);}
  const verb=ctx.createConvolver();verb.buffer=ir;const verbG=ctx.createGain();verbG.gain.value=0.35;verb.connect(verbG);verbG.connect(master);
  const src=(buf,start,stop,loop=true)=>{const s=ctx.createBufferSource();s.buffer=buf;s.loop=loop;s.start(at(start),r()*1.5);if(stop!=null)s.stop(at(stop));return s;};
  const chain=(...n)=>{for(let i=0;i<n.length-1;i++)n[i].connect(n[i+1]);return n[n.length-1];};
  const filt=(type,f,q=0.7)=>{const b=ctx.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q;return b;};
  const gain=(v=0)=>{const g=ctx.createGain();g.gain.value=v;return g;};
  const pan=(p)=>{const s=ctx.createStereoPanner();s.pan.value=p;return s;};
  const env=(g,pts)=>{g.gain.setValueAtTime(pts[0][1],at(pts[0][0]));for(const [tt,v,exp] of pts.slice(1)){if(exp)g.gain.exponentialRampToValueAtTime(Math.max(v,1e-4),at(tt));else g.gain.linearRampToValueAtTime(v,at(tt));}};

  // --- música da academia (abafada, vinda das caixas) ---
  const music=gain(0.42);const mlp=filt('lowpass',1700);chain(mlp,music,master);music.connect(verb);
  const beat=60/124;
  for(let k=0;k*beat<T_TREMOR+0.2;k++){const tt=k*beat;
    const o=ctx.createOscillator();o.frequency.setValueAtTime(140,at(tt));o.frequency.exponentialRampToValueAtTime(42,at(tt+0.13));const g=gain(0);env(g,[[tt,0.0001],[tt+0.005,0.9],[tt+0.32,0.0001,1]]);chain(o,g,mlp);o.start(at(tt));o.stop(at(tt+0.35));
    const h=src(white,tt+beat/2,tt+beat/2+0.06,false);const hg=gain(0);env(hg,[[tt+beat/2,0.13],[tt+beat/2+0.05,0.0001,1]]);chain(h,filt('highpass',7000),hg,mlp);
    const notes=[55,55,65.4,49];const f=notes[Math.floor(k/4)%4];
    for(const off of [0,beat/2]){const b=ctx.createOscillator();b.type='sawtooth';b.frequency.value=f;const bg=gain(0);env(bg,[[tt+off,0.0001],[tt+off+0.01,0.22],[tt+off+0.2,0.0001,1]]);chain(b,filt('lowpass',320,2),bg,mlp);b.start(at(tt+off));b.stop(at(tt+off+0.22));}
  }
  mlp.frequency.setValueAtTime(1700,at(T_TREMOR));mlp.frequency.exponentialRampToValueAtTime(90,at(T_TREMOR+0.7));
  music.gain.setValueAtTime(0.42,at(T_TREMOR));music.gain.linearRampToValueAtTime(0,at(T_TREMOR+0.9));
  {const o=ctx.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(180,at(T_TREMOR));o.frequency.exponentialRampToValueAtTime(28,at(T_TREMOR+0.8));const g=gain(0);env(g,[[T_TREMOR,0.0001],[T_TREMOR+0.03,0.08],[T_TREMOR+0.85,0.0001,1]]);chain(o,filt('lowpass',600),g,master);o.start(at(T_TREMOR));o.stop(at(T_TREMOR+0.9));}

  // --- tom do ambiente + conversa ---
  {const s=src(brown,0,T_BLACK);const g=gain(0);env(g,[[0,0],[0.6,0.08],[T_BLACK-0.01,0.08],[T_BLACK,0]]);chain(s,filt('lowpass',500),g,master);}
  {const s=src(pink,0,T_BLACK);const bp=filt('bandpass',520,1.1);const g=gain(0);
   env(g,[[0,0],[0.8,0.05],[T_TREMOR,0.05],[T_TREMOR+0.5,0.004],[T_COLLAPSE,0.004],[T_COLLAPSE+0.4,0.12],[T_BLACK-0.01,0.1],[T_BLACK,0]]);
   bp.frequency.setValueAtTime(520,at(T_COLLAPSE));bp.frequency.linearRampToValueAtTime(950,at(T_COLLAPSE+0.5));chain(s,bp,g,master);
   for(let k=0;k<26;k++){const tt=0.5+k*0.17;if(tt>T_TREMOR)break;bp.frequency.setValueAtTime(420+r()*260,at(tt));}}

  // --- gritos (formantes) ---
  for(let k=0;k<9;k++){const tt=T_COLLAPSE+0.15+k*0.62+r()*0.4;const f0=360+r()*320,dur=0.7+r()*0.9,pn=r()*1.6-0.8,gv=0.035+r()*0.045;
    const o=ctx.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(f0,at(tt));o.frequency.linearRampToValueAtTime(f0*1.45,at(tt+0.18));o.frequency.linearRampToValueAtTime(f0*0.75,at(tt+dur));
    const vib=ctx.createOscillator();vib.frequency.value=5.5+r()*2;const vg=gain(f0*0.035);chain(vib,vg);vg.connect(o.frequency);
    const g=gain(0);env(g,[[tt,0.0001],[tt+0.06,gv],[tt+dur*0.7,gv*0.8],[tt+dur,0.0001,1]]);
    const f1=filt('bandpass',900+r()*200,5),f2=filt('bandpass',2500+r()*400,6);const p=pan(pn);o.connect(f1);o.connect(f2);f1.connect(g);f2.connect(g);chain(g,p,master);p.connect(verb);
    o.start(at(tt));o.stop(at(tt+dur+0.05));vib.start(at(tt));vib.stop(at(tt+dur+0.05));}

  // --- estrondo ---
  {const s=src(brown,T_TREMOR,T_BLACK);const lp=filt('lowpass',95);const g=gain(0);
   env(g,[[T_TREMOR,0],[T_TREMOR+1,0.55],[T_CRACK,0.75],[T_COLLAPSE,0.8],[T_COLLAPSE+0.1,1.25],[T_FALL,1.1],[T_FALL+0.6,1.5],[T_BLACK-0.01,1.5],[T_BLACK,0]]);chain(s,lp,g,master);
   const sub=ctx.createOscillator();sub.frequency.value=31;const sg=gain(0);env(sg,[[T_TREMOR,0],[T_TREMOR+1.2,0.35],[T_COLLAPSE+0.1,0.6],[T_BLACK-0.01,0.6],[T_BLACK,0]]);
   const trem=ctx.createOscillator();trem.frequency.value=7;const tg=gain(0.15);chain(trem,tg);tg.connect(sg.gain);chain(sub,sg,master);sub.start(at(T_TREMOR));sub.stop(at(T_BLACK));trem.start(at(T_TREMOR));trem.stop(at(T_BLACK));}
  const crack=(tt,g0)=>{const s=src(white,tt,tt+0.5,false);const g=gain(0);env(g,[[tt,g0],[tt+0.35,0.0001,1]]);chain(s,filt('highpass',1400),g,pan(r()*1.2-0.6),master);g.connect(verb);
    const o=ctx.createOscillator();o.frequency.setValueAtTime(90,at(tt));o.frequency.exponentialRampToValueAtTime(35,at(tt+0.4));const og=gain(0);env(og,[[tt,0.7],[tt+0.45,0.0001,1]]);chain(o,og,master);o.start(at(tt));o.stop(at(tt+0.5));};
  crack(T_CRACK,0.55);crack(T_CRACK+0.32,0.4);crack(T_CRACK+0.55,0.5);crack(T_COLLAPSE-0.1,0.6);
  {const tt=T_COLLAPSE;const s=src(brown,tt,tt+4,false);const lp=filt('lowpass',600);lp.frequency.setValueAtTime(600,at(tt));lp.frequency.exponentialRampToValueAtTime(70,at(tt+3.5));
   const g=gain(0);env(g,[[tt,1.6],[tt+3.8,0.0001,1]]);chain(s,lp,g,master);g.connect(verb);
   const o=ctx.createOscillator();o.frequency.setValueAtTime(60,at(tt));o.frequency.exponentialRampToValueAtTime(22,at(tt+2.2));const og=gain(0);env(og,[[tt,1],[tt+2.5,0.0001,1]]);chain(o,og,master);o.start(at(tt));o.stop(at(tt+2.6));}
  // destroços: concreto e metal
  for(let k=0;k<44;k++){const tt=T_COLLAPSE+0.2+r()*(T_BLACK-T_COLLAPSE-0.3);const p=pan(r()*1.8-0.9);
    if(r()<0.6){const s=src(white,tt,tt+1,false);const g=gain(0);const d=0.25+r()*0.6;env(g,[[tt,0.2+r()*0.35],[tt+d,0.0001,1]]);chain(s,filt('bandpass',250+r()*700,0.9),g,p,master);}
    else{const g=gain(0);env(g,[[tt,0.12+r()*0.15],[tt+0.9,0.0001,1]]);chain(g,p,master);g.connect(verb);
      for(const m of [1,2.76,5.4]){const o=ctx.createOscillator();o.frequency.value=(300+r()*500)*m;chain(o,g);o.start(at(tt));o.stop(at(tt+1));}}}
  // vidro da TV
  {const tt=8.7+1.0;const s=src(white,tt,tt+1.2,false);const g=gain(0);env(g,[[tt,0.45],[tt+0.9,0.0001,1]]);chain(s,filt('highpass',4500),g,pan(0.1),master);g.connect(verb);}
  // alarme
  {const o=ctx.createOscillator();o.type='square';const g=gain(0);env(g,[[T_COLLAPSE+0.6,0],[T_COLLAPSE+0.9,0.035],[T_BLACK-0.01,0.035],[T_BLACK,0]]);
   for(let k=0,tt=T_COLLAPSE+0.6;tt<T_BLACK;k++,tt+=0.45)o.frequency.setValueAtTime(k%2?770:960,at(tt));
   chain(o,filt('lowpass',2400),g,master);g.connect(verb);o.start(at(T_COLLAPSE+0.6));o.stop(at(T_BLACK));}
  // vento da queda
  {const s=src(pink,T_FALL,T_BLACK);const bp=filt('bandpass',400,0.8);bp.frequency.setValueAtTime(400,at(T_FALL));bp.frequency.exponentialRampToValueAtTime(1800,at(T_BLACK));
   const g=gain(0);env(g,[[T_FALL,0],[T_BLACK-0.02,0.9],[T_BLACK,0]]);chain(s,bp,g,master);}
  // título: impacto grave
  {const tt=T_TITLE;const lp=filt('lowpass',2200);lp.frequency.setValueAtTime(2200,at(tt));lp.frequency.exponentialRampToValueAtTime(260,at(tt+3.2));
   const g=gain(0);env(g,[[tt,0.0001],[tt+0.04,0.55],[tt+5.5,0.0001,1]]);chain(lp,g,master);g.connect(verb);
   for(const [f,ty] of [[49,'sawtooth'],[49.35,'sawtooth'],[98.2,'sawtooth'],[36.7,'sine']]){const o=ctx.createOscillator();o.type=ty;o.frequency.value=f;o.connect(lp);o.start(at(tt));o.stop(at(tt+5.6));}
   const s=src(brown,tt,tt+2,false);const ng=gain(0);env(ng,[[tt,0.9],[tt+1.6,0.0001,1]]);chain(s,filt('lowpass',300),ng,master);}
}

/* ---------------- reprodução / gravação ---------------- */
let actx=null,playing=false,a0=0,clock0=0,recorder=null;
const hud=document.getElementById('hud'),intro=document.getElementById('intro'),recEl=document.getElementById('rec');
function play({record=false}={}){
  resetWorld();intro.classList.add('hide');hud.classList.remove('show');
  if(actx)actx.close();actx=new (window.AudioContext||window.webkitAudioContext)();
  const dest=actx.createGain();dest.connect(actx.destination);
  let recDest=null;if(record){recDest=actx.createMediaStreamDestination();dest.connect(recDest);}
  a0=actx.currentTime+0.15;scheduleAudio(actx,dest,a0);clock0=performance.now()+150;playing=true;
  if(record){
    const stream=canvas.captureStream(30);recDest.stream.getAudioTracks().forEach(tr=>stream.addTrack(tr));
    const mime=['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||'';
    const chunks=[];recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:12e6});recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);
    recorder.onstop=()=>{const blob=new Blob(chunks,{type:recorder.mimeType});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='abertura-cratera.'+(recorder.mimeType.includes('mp4')?'mp4':'webm');a.click();recEl.classList.remove('on');recorder=null;};
    recorder.start();recEl.classList.add('on');
  }
}
function loop(){
  requestAnimationFrame(loop);
  if(playing){
    const target=actx&&actx.state==='running'?actx.currentTime-a0:(performance.now()-clock0)/1000;
    let guard=0;while(T<target&&guard++<12)step(1/60);
    if(T>=T_END){playing=false;hud.classList.add('show');if(recorder)recorder.stop();}
  }
  render();
}

if(CAPTURE){
  // modo de exportação quadro a quadro (usado para renderizar o MP4)
  window.cap={
    init(w,h){resize(w,h);resetWorld();return true;},
    frame(t){while(T<t-1e-6)step(1/60);render();return renderer.domElement.toDataURL('image/jpeg',0.93);},
    async audio(){const SR=48000,len=Math.ceil((T_END+0.5)*SR);const oc=new OfflineAudioContext(2,len,SR);scheduleAudio(oc,oc.destination,0);
      const buf=await oc.startRendering();const L=buf.getChannelData(0),R=buf.getChannelData(1);const n=L.length;const ab=new ArrayBuffer(44+n*4);const dv=new DataView(ab);
      const ws=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i));};ws(0,'RIFF');dv.setUint32(4,36+n*4,true);ws(8,'WAVE');ws(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,2,true);dv.setUint32(24,SR,true);dv.setUint32(28,SR*4,true);dv.setUint16(32,4,true);dv.setUint16(34,16,true);ws(36,'data');dv.setUint32(40,n*4,true);
      for(let i=0;i<n;i++){dv.setInt16(44+i*4,clamp(L[i],-1,1)*32767,true);dv.setInt16(46+i*4,clamp(R[i],-1,1)*32767,true);}
      let s='';const u8=new Uint8Array(ab);for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);},
  };
  intro.style.display='none';
}else{
  resize();addEventListener('resize',()=>resize());resetWorld();
  // quadro de abertura atrás do menu
  render();loop();
  const pb=document.getElementById('play'),rb=document.getElementById('record');
  (document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{pb.disabled=false;rb.disabled=!(window.MediaRecorder&&canvas.captureStream);document.getElementById('loading').textContent='';});
  pb.onclick=()=>play();rb.onclick=()=>play({record:true});
  document.getElementById('replay').onclick=()=>play();
  document.getElementById('fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();};
  addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')play();});
  if(Q.has('t')){T=0;resetWorld();const tt=parseFloat(Q.get('t'));while(T<tt)step(1/60);intro.classList.add('hide');}
}
</script>
